name: job-radar

on:
  schedule:
    # Lunes y jueves, 8:00 de Argentina.
    - cron: "0 11 * * 1,4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Mostrar resultados sin guardarlos"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest
      - run: python radar.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
